<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلباتي | القهوجي</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand"><div class="roast-stamp">ق</div>القهوجي</a>
  <nav><a href="index.html">المتجر</a><span id="authArea"></span></nav>
</header>

<main class="container">
  <section>
    <div class="section-head"><div><h2>طلباتي</h2><div class="sub" id="statementSub"></div></div></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>رقم الطلب</th><th>التاريخ</th><th>عدد المنتجات</th><th>الإجمالي</th><th>الحالة</th><th></th></tr></thead>
        <tbody id="ordersBody"><tr><td colspan="6">جاري التحميل...</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/helpers.js"></script>
<script src="js/auth.js"></script>
<script>
let myOrders = [];

requireAuth(["client", "merchant"], (profile) => {
  document.getElementById("authArea").innerHTML =
    `<span style="opacity:.8;font-size:13px">مرحباً، ${escapeHtml(profile.name)}</span> <button onclick="logout()">خروج</button>`;

  db.collection(COL.ORDERS).where("userId", "==", profile.uid).orderBy("createdAt", "desc")
    .onSnapshot((snap) => {
      const orders = snap.docs.map(d => ({id: d.id, ...d.data()}));
      myOrders = orders;
      const body = document.getElementById("ordersBody");
      if (orders.length === 0) {
        body.innerHTML = `<tr><td colspan="6">لا توجد طلبات سابقة بعد</td></tr>`;
        return;
      }
      body.innerHTML = orders.map(o => `
        <tr>
          <td>${shortId(o.id)}</td>
          <td>${formatDate(o.createdAt)}</td>
          <td>${o.items.reduce((s,i)=>s+i.qty,0)}</td>
          <td>${formatPrice(o.total)}</td>
          <td><span class="status-badge ${statusClass(o.status)}">${statusLabel(o.status)}</span></td>
          <td><button class="btn btn-ghost btn-sm" onclick="viewOrder('${o.id}')">التفاصيل</button></td>
        </tr>`).join("");

      if (profile.role === "merchant") {
        const total = orders.filter(o=>o.status!=="rejected").reduce((s,o)=>s+o.total,0);
        document.getElementById("statementSub").textContent = `كشف حساب مبسط — إجمالي المشتريات: ${formatPrice(total)}`;
      }
    }, (err) => {
      document.getElementById("ordersBody").innerHTML = `<tr><td colspan="6">تعذّر تحميل الطلبات</td></tr>`;
    });
});

function viewOrder(orderId) {
  const o = myOrders.find(x => x.id === orderId);
  if (!o) return;
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) this.remove()">
      <div class="modal-form">
        <h2 style="font-family:var(--font-display)">تفاصيل الطلب ${shortId(o.id)}</h2>
        <p style="color:#8a7a6a;font-size:13px;margin-bottom:10px">${formatDate(o.createdAt)} • <span class="status-badge ${statusClass(o.status)}">${statusLabel(o.status)}</span></p>
        <div class="table-wrap"><table>
          <thead><tr><th>المنتج</th><th>الوزن</th><th>الكمية</th><th>السعر</th></tr></thead>
          <tbody>${o.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td>${weightLabel(i.weight)}</td><td>${i.qty}</td><td>${formatPrice(i.price*i.qty)}</td></tr>`).join("")}</tbody>
        </table></div>
        <div style="margin-top:14px;font-weight:800;display:flex;justify-content:space-between"><span>الإجمالي</span><span>${formatPrice(o.total)}</span></div>
        <button class="btn btn-ghost btn-block" style="margin-top:14px" onclick="this.closest('.modal-overlay').remove()">إغلاق</button>
      </div>
    </div>`;
}
</script>
</body>
</html>
