<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | القهوجي</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand"><div class="roast-stamp">ق</div>القهوجي</a>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div id="loginView">
      <h2>تسجيل الدخول</h2>
      <p class="sub">أهلاً بعودتك، سجّل الدخول لمتابعة طلباتك</p>
      <div id="loginMsg" class="form-msg" style="display:none"></div>
      <form id="loginForm">
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" required></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="loginPassword" required></div>
        <button class="btn btn-gold btn-block" type="submit">دخول</button>
      </form>
      <div class="auth-switch">ليس لديك حساب؟ <a onclick="toggleView()">إنشاء حساب جديد</a></div>
    </div>

    <div id="registerView" style="display:none">
      <h2>إنشاء حساب</h2>
      <p class="sub">اختر نوع الحساب المناسب لك</p>
      <div class="role-toggle">
        <button type="button" class="active" data-role="client">عميل</button>
        <button type="button" data-role="merchant">تاجر</button>
      </div>
      <div id="registerMsg" class="form-msg" style="display:none"></div>
      <form id="registerForm">
        <div class="field"><label>الاسم الكامل</label><input id="regName" required></div>
        <div class="field"><label>رقم الهاتف</label><input id="regPhone" required></div>
        <div class="field" id="storeField" style="display:none"><label>اسم المتجر/المحل</label><input id="regStore"></div>
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="regEmail" required></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="regPassword" required minlength="6"></div>
        <button class="btn btn-gold btn-block" type="submit">إنشاء الحساب</button>
      </form>
      <div class="auth-switch">لديك حساب بالفعل؟ <a onclick="toggleView()">تسجيل الدخول</a></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/helpers.js"></script>
<script src="js/auth.js"></script>
<script>
  function toggleView() {
    const l = document.getElementById("loginView");
    const r = document.getElementById("registerView");
    l.style.display = l.style.display === "none" ? "block" : "none";
    r.style.display = r.style.display === "none" ? "block" : "none";
  }
  document.querySelectorAll(".role-toggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.getElementById("storeField").style.display = btn.dataset.role === "merchant" ? "block" : "none";
    });
  });
  initAuthPage();
</script>
</body>
</html>
